name: Build

on:
  push:
    branches: [feature/packaging]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Descargar JavaFX jmods
        run: |
          wget -q https://download2.gluonhq.com/openjfx/21.0.6/openjfx-21.0.6_linux-x64_bin-jmods.zip
          unzip openjfx-21.0.6_linux-x64_bin-jmods.zip -d ~/.javafx-jmods

      - name: Compilar y generar imagen
        run: mvn verify

      - uses: actions/upload-artifact@v3
        with:
          name: Java-Tetris-Linux
          path: Java-Tetris/

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Descargar JavaFX jmods
        run: |
          Invoke-WebRequest -Uri "https://download2.gluonhq.com/openjfx/21.0.6/openjfx-21.0.6_windows-x64_bin-jmods.zip" -OutFile "javafx-jmods.zip"
          Expand-Archive -Path "javafx-jmods.zip" -DestinationPath "$env:USERPROFILE\.javafx-jmods"

      - name: Compilar y generar imagen
        run: mvn verify

      - uses: actions/upload-artifact@v3
        with:
          name: Java-Tetris-Windows
          path: Java-Tetris/

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Descargar JavaFX jmods
        run: |
          wget -q https://download2.gluonhq.com/openjfx/21.0.6/openjfx-21.0.6_osx-x64_bin-jmods.zip
          unzip openjfx-21.0.6_osx-x64_bin-jmods.zip -d ~/.javafx-jmods

      - name: Compilar y generar imagen
        run: mvn verify

      - uses: actions/upload-artifact@v3
        with:
          name: Java-Tetris-Mac
          path: Java-Tetris/
