name: Build

on:
  push:
    branches: [feature/packaging]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup JavaFX JMODs
        shell: bash
        run: |
          # Detectar SO para descargar el archivo correcto
          if [ "${{ matrix.os }}" == "ubuntu-latest" ]; then
            URL="https://download2.gluonhq.com/openjfx/21.0.6/openjfx-21.0.6_linux-x64_bin-jmods.zip"
          elif [ "${{ matrix.os }}" == "macos-latest" ]; then
            URL="https://download2.gluonhq.com/openjfx/21.0.6/openjfx-21.0.6_osx-x64_bin-jmods.zip"
          else
            URL="https://download2.gluonhq.com/openjfx/21.0.6/openjfx-21.0.6_windows-x64_bin-jmods.zip"
          fi
          curl -L $URL -o javafx-jmods.zip
          mkdir -p javafx-jmods
          unzip javafx-jmods.zip -d javafx-jmods
          echo "JAVAFX_JMODS=${{ github.workspace }}/javafx-jmods" >> $GITHUB_ENV

      - name: Build with Maven
        run: mvn verify -Djavafx.jmods=$JAVAFX_JMODS

      - uses: actions/upload-artifact@v4
        with:
          name: Java-Tetris-${{ matrix.os }}
          path: target/ # Ajusta esto a donde tu plugin deje el ejecutable final
